name: Update README Recent Activity

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: Update README with recent GitHub activity
    steps:
      - uses: actions/checkout@v5

      - uses: gautamkrishnar/user-activity-readme-action@v2.5.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          COMMIT_MSG: "⚡ bot: update recent activity log"
          MAX_LINES: 5
