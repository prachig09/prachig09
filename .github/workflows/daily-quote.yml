name: Update Daily Quote

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-quote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Fetch Quote and Update README
        run: |
          python3 -c "
          import random
          import re

          quotes = [
              {'quote': 'The most dangerous phrase in the language is, \"We\'ve always done it this way.\"', 'author': 'Grace Hopper'},
              {'quote': 'That brain of mine is something more than merely mortal; as time will show.', 'author': 'Ada Lovelace'},
              {'quote': 'There was no choice but to be pioneers.', 'author': 'Margaret Hamilton'},
              {'quote': 'Coding is the language of the future, and every girl should learn it.', 'author': 'Reshma Saujani'},
              {'quote': 'If you can see it, you can be it.', 'author': 'Anita Borg'},
              {'quote': 'If you think technology will solve your problems, you don\'t understand the problems and you don\'t understand the technology.', 'author': 'Radia Perlman'},
              {'quote': 'AI will change the world, but it won\'t change what makes us human.', 'author': 'Fei-Fei Li'},
              {'quote': 'Data is not neutral. Algorithms are not neutral. They reflect the biases of their creators.', 'author': 'Joy Buolamwini'},
              {'quote': 'Technology should be an equalizer, enabling everyone to participate fully in society.', 'author': 'Barbara Liskov'}
          ]

          selected = random.choice(quotes)
          quote_text = selected['quote']
          author_text = selected['author']

          new_block = f'> > \"{quote_text}\"\n> > — *{author_text}*'

          with open('README.md', 'r') as f:
              content = f.read()

          pattern = r'.*?'
          replacement = f'\n{new_block}\n'

          updated_content = re.sub(pattern, replacement, content, flags=re.DOTALL)

          with open('README.md', 'w') as f:
              f.write(updated_content)
          "

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "⚡ bot: update daily inspiration quote" || exit 0
          git push
